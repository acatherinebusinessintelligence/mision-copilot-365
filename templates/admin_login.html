<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Misión Copilot 365</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --brand-primary:#4a3da6; --brand-accent:#ffec00; --brand-dark:#221e40; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; font-family:Montserrat,system-ui,sans-serif;
      background: linear-gradient(160deg,#221e40,#2a2558); color:#fff;
      display:grid; place-items:center; padding:1.5rem;
    }
    .card {
      width:min(400px,100%); background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.15); border-radius:16px; padding:1.75rem;
      border-bottom:6px solid var(--brand-primary);
    }
    h1 { font-size:1.25rem; margin:0 0 .5rem; }
    p { color:rgba(255,255,255,.7); font-size:.9rem; }
    label { display:block; font-size:.82rem; font-weight:600; margin:1rem 0 .35rem; }
    input {
      width:100%; padding:.75rem .9rem; border-radius:10px; border:1px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.08); color:#fff; font:inherit;
    }
    button {
      width:100%; margin-top:1.25rem; padding:.9rem; border:0; border-radius:10px;
      background:var(--brand-primary); color:#fff; font-weight:700; cursor:pointer; font:inherit;
    }
    .error { background:rgba(192,57,43,.25); border:1px solid rgba(192,57,43,.5); padding:.7rem; border-radius:10px; margin-bottom:1rem; font-size:.88rem; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/admin/login">
    <img src="/logo.png" alt="Logo" style="height:48px;background:#223342;border-radius:6px;padding:4px 8px;margin-bottom:1rem;" />
    <h1>Administración</h1>
    <p>Panel de progreso y generación de claves.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="password">Contraseña de administrador</label>
    <input id="password" name="password" type="password" required />
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
