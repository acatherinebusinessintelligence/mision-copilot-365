<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso · Misión Copilot 365</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-primary: #4a3da6;
      --brand-accent: #ffec00;
      --brand-dark: #221e40;
      --brand-dark-alt: #223342;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Montserrat, system-ui, sans-serif;
      background:
        linear-gradient(115deg, rgba(34,30,64,.94), rgba(74,61,166,.7)),
        url("/fondo-corporativo.png") center/cover;
      color: #fff; display: grid; place-items: center; padding: 1.5rem;
    }
    .card {
      width: min(420px, 100%); background: rgba(34,30,64,.92);
      border: 1px solid rgba(255,255,255,.15); border-radius: 16px;
      padding: 1.75rem; box-shadow: 0 20px 50px rgba(0,0,0,.35);
      border-bottom: 6px solid var(--brand-primary);
    }
    .logo { height: 52px; width: auto; max-width: 100%; background: var(--brand-dark-alt); border-radius: 6px; padding: 4px 8px; margin-bottom: 1.25rem; }
    h1 { font-size: 1.35rem; margin: 0 0 .35rem; }
    p { color: rgba(255,255,255,.75); font-size: .92rem; margin: 0 0 1.25rem; }
    label { display: block; font-size: .82rem; font-weight: 600; margin: .85rem 0 .35rem; }
    input {
      width: 100%; padding: .75rem .9rem; border-radius: 10px; border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08); color: #fff; font: inherit;
    }
    input:focus { outline: 2px solid var(--brand-accent); border-color: transparent; }
    button {
      width: 100%; margin-top: 1.25rem; padding: .9rem; border: 0; border-radius: 10px;
      background: var(--brand-accent); color: var(--brand-dark); font-weight: 800; cursor: pointer; font: inherit;
    }
    button:hover { filter: brightness(1.05); }
    .error {
      background: rgba(192,57,43,.2); border: 1px solid rgba(192,57,43,.5);
      color: #ffd7d3; padding: .7rem .85rem; border-radius: 10px; font-size: .88rem; margin-bottom: 1rem;
    }
    .hint { margin-top: 1rem; font-size: .78rem; color: rgba(255,255,255,.55); text-align: center; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login" autocomplete="on">
    <img class="logo" src="/logo.png" alt="ECCO · Universidad Sergio Arboleda" />
    <h1>Misión Copilot 365</h1>
    <p>Ingresa con el correo y la clave que recibiste.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label for="email">Correo</label>
    <input id="email" name="email" type="email" required placeholder="tu.correo@ejemplo.com" />
    <label for="access_key">Clave de acceso</label>
    <input id="access_key" name="access_key" type="text" required placeholder="MCP-XXXX-XXXX" style="text-transform:uppercase; letter-spacing:.04em;" />
    <button type="submit">Entrar a la misión</button>
    <p class="hint">Tu progreso se guarda automáticamente en el sistema.</p>
  </form>
</body>
</html>
